
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0715">

    <title>Create Account | QuickWeb</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <main class="auth-page">

        <a href="{{ url_for('home') }}" class="auth-home-logo">
            QUICK<span>WEB</span>
        </a>

        <section class="auth-box signup-box">

            <div class="auth-icon">QW</div>

            <p class="auth-eyebrow">JOIN QUICKWEB</p>

            <h1>Create your <span>account.</span></h1>

            <p class="auth-subtitle">
                Your next great idea starts with one small step.
            </p>

            <form method="POST" class="auth-form" id="signupForm">

                <div class="auth-field">
                    <label for="username">Username</label>

                    <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        minlength="3"
                        maxlength="30"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="email">Email address</label>

                    <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>

                    <div class="auth-password-wrap">
                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                            aria-controls="password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>

                    <div class="password-meter" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <p class="password-hint" id="passwordHint"
                       aria-live="polite">
                        Use at least 8 characters.
                    </p>
                </div>

                <button type="submit" class="auth-button">
                    <span>Create Account</span>
                    <span class="auth-button-arrow">→</span>
                </button>

            </form>

            <div class="auth-divider">
                <span></span>
                <p>ALREADY A MEMBER?</p>
                <span></span>
            </div>

            <p class="switch-auth">
                Already have an account?
                <a href="{{ url_for('login') }}">Sign in</a>
            </p>

        </section>

        <a class="back-home" href="{{ url_for('home') }}">
            ← Back to homepage
        </a>

        <p class="auth-footer">
            SIMPLE TOOLS. BETTER WORKFLOWS.
        </p>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");
        const passwordHint = document.getElementById("passwordHint");
        const meterBars = document.querySelectorAll(".password-meter span");

        passwordToggle.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            passwordToggle.textContent = isHidden ? "Hide" : "Show";
            passwordToggle.setAttribute("aria-pressed", String(isHidden));
            passwordToggle.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        });

        passwordInput.addEventListener("input", function () {
            const value = passwordInput.value;
            let score = 0;

            if (value.length >= 8) score++;
            if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score++;
            if (/\d/.test(value)) score++;
            if (/[^A-Za-z0-9]/.test(value)) score++;

            meterBars.forEach((bar, index) => {
                bar.classList.toggle("active", index < score);
            });

            if (!value) {
                passwordHint.textContent = "Use at least 8 characters.";
            } else if (value.length < 8) {
                passwordHint.textContent = "Use at least 8 characters.";
            } else if (score <= 2) {
                passwordHint.textContent = "Consider adding more variety.";
            } else if (score === 3) {
                passwordHint.textContent = "Good password variety.";
            } else {
                passwordHint.textContent = "Great password variety!";
            }
        });
    </script>

</body>
</html>
