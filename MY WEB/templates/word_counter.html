
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter | QuickWeb</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #f8f7ff;
            background:
                radial-gradient(ellipse at top left, #301957 0%, transparent 45%),
                linear-gradient(135deg, #170d2b, #100b20);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .navbar {
            max-width: 1100px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 18px;
            background: rgba(255,255,255,.045);
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: #a78bfa;
        }

        .back-link {
            color: #c4b5fd;
            font-size: 14px;
        }

        main {
            max-width: 900px;
            margin: 65px auto;
        }

        .eyebrow {
            color: #b49aff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0;
            font-size: clamp(32px, 5vw, 48px);
            letter-spacing: -1.5px;
        }

        .gradient-text {
            color: #a78bfa;
        }

        .subtitle {
            color: #aaa1bc;
            line-height: 1.7;
        }

        .counter-box {
            margin-top: 32px;
            padding: 24px;
            border: 1px solid rgba(167,139,250,.2);
            border-radius: 22px;
            background: rgba(255,255,255,.045);
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .stat {
            padding: 17px 12px;
            border-radius: 14px;
            background: rgba(139,92,246,.10);
            border: 1px solid rgba(167,139,250,.12);
        }

        .stat-number {
            display: block;
            margin-bottom: 7px;
            font-size: 27px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .stat-label {
            color: #aaa1bc;
            font-size: 12px;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 260px;
            resize: vertical;
            padding: 20px;
            border: 1px solid rgba(167,139,250,.22);
            border-radius: 14px;
            outline: none;
            background: rgba(12,8,25,.65);
            color: white;
            font: inherit;
            font-size: 15px;
            line-height: 1.8;
        }

        textarea:focus {
            border-color: #9b7aff;
            box-shadow: 0 0 0 3px rgba(139,92,246,.12);
        }

        textarea::placeholder {
            color: #746b88;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        button {
            padding: 12px 19px;
            border: 1px solid rgba(167,139,250,.25);
            border-radius: 11px;
            color: #eee8ff;
            background: rgba(139,92,246,.12);
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            transform: translateY(-2px);
            border-color: #a78bfa;
        }

        .primary {
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #635bdb);
        }

        .message {
            min-height: 20px;
            margin-top: 12px;
            color: #c4b5fd;
            font-size: 13px;
        }

        footer {
            margin-top: 55px;
            color: #776d8b;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 650px) {
            body {
                padding: 14px;
            }

            .navbar {
                padding: 16px;
            }

            main {
                margin-top: 45px;
            }

            .counter-box {
                padding: 15px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            textarea {
                min-height: 220px;
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="logo">
            QUICK<span>WEB</span>
        </a>
        <a href="{{ url_for('tools_dashboard') }}" class="back-link">
            ← All Tools
        </a>
    </nav>

    <main>
        <div class="eyebrow">QUICKWEB TOOL #01</div>
        <h1>Word <span class="gradient-text">Counter.</span></h1>
        <p class="subtitle">
            Count words, characters, sentences and paragraphs instantly.
            Just type or paste your text below.
        </p>

        <section class="counter-box">
            <div class="stats">
                <div class="stat">
                    <span class="stat-number" id="words">0</span>
                    <span class="stat-label">Words</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="characters">0</span>
                    <span class="stat-label">Characters</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="sentences">0</span>
                    <span class="stat-label">Sentences</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="paragraphs">0</span>
                    <span class="stat-label">Paragraphs</span>
                </div>
            </div>

            <label for="textInput" class="stat-label">
                YOUR TEXT
            </label>

            <textarea
                id="textInput"
                placeholder="Start typing or paste your text here..."
                spellcheck="true"
            ></textarea>

            <div class="actions">
                <button class="primary" id="copyBtn" type="button">
                    Copy Text
                </button>
                <button id="clearBtn" type="button">
                    Clear Text
                </button>
                <button id="sampleBtn" type="button">
                    Try Sample
                </button>
            </div>

            <div class="message" id="message" role="status" aria-live="polite"></div>
        </section>

        <footer>
            QuickWeb · Simple tools. Better productivity.
        </footer>
    </main>

    <script>
        const textInput = document.getElementById("textInput");
        const wordsEl = document.getElementById("words");
        const charactersEl = document.getElementById("characters");
        const sentencesEl = document.getElementById("sentences");
        const paragraphsEl = document.getElementById("paragraphs");
        const message = document.getElementById("message");

        function updateCounts() {
            const text = textInput.value;
            const trimmed = text.trim();

            const words = trimmed
                ? trimmed.split(/\s+/u).length
                : 0;

            const sentences = trimmed
                ? (trimmed.match(/[^.!?]+[.!?]+|[^.!?]+$/gu) || [])
                    .filter(sentence => sentence.trim().length > 0).length
                : 0;

            const paragraphs = trimmed
                ? trimmed.split(/\n\s*\n/u)
                    .filter(paragraph => paragraph.trim().length > 0).length
                : 0;

            wordsEl.textContent = words.toLocaleString();
            charactersEl.textContent = text.length.toLocaleString();
            sentencesEl.textContent = sentences.toLocaleString();
            paragraphsEl.textContent = paragraphs.toLocaleString();
        }

        textInput.addEventListener("input", () => {
            updateCounts();
            message.textContent = "";
        });

        document.getElementById("clearBtn").addEventListener("click", () => {
            textInput.value = "";
            updateCounts();
            message.textContent = "Text cleared.";
            textInput.focus();
        });

        document.getElementById("sampleBtn").addEventListener("click", () => {
            textInput.value =
                "Welcome to QuickWeb! This is your new Word Counter.\n\n" +
                "Write, edit, and count your text instantly. " +
                "Simple tools make everyday tasks easier.";
            updateCounts();
            message.textContent = "Sample text loaded.";
        });

        document.getElementById("copyBtn").addEventListener("click", async () => {
            if (!textInput.value) {
                message.textContent = "Enter some text before copying.";
                return;
            }

            try {
                await navigator.clipboard.writeText(textInput.value);
                message.textContent = "Text copied to clipboard!";
            } catch {
                textInput.focus();
                textInput.select();
                const copied = document.execCommand("copy");
                message.textContent = copied
                    ? "Text copied to clipboard!"
                    : "Copy failed. Select the text and copy it manually.";
            }
        });

        updateCounts();
    </script>
</body>
</html>
