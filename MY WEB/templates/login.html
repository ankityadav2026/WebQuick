
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0715">

    <title>Login | QuickWeb</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <main class="auth-page">

        <a href="{{ url_for('home') }}" class="auth-home-logo">
            QUICK<span>WEB</span>
        </a>

        <section class="auth-box">

            <div class="auth-icon">QW</div>

            <p class="auth-eyebrow">WELCOME BACK</p>

            <h1>Good to see you<span>.</span></h1>

            <p class="auth-subtitle">
                Sign in to continue your journey with QuickWeb.
            </p>

            <form method="POST" class="auth-form">

                <div class="auth-field">
                    <label for="username">Username</label>

                    <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="auth-field">
                    <div class="auth-label-row">
                        <label for="password">Password</label>
                    </div>

                    <div class="auth-password-wrap">
                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                            aria-controls="password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-button">
                    <span>Sign In</span>
                    <span class="auth-button-arrow">→</span>
                </button>

            </form>

            <div class="auth-divider">
                <span></span>
                <p>NEW TO QUICKWEB?</p>
                <span></span>
            </div>

            <p class="switch-auth">
                Don't have an account?
                <a href="{{ url_for('signup') }}">Create one</a>
            </p>

        </section>

        <a class="back-home" href="{{ url_for('home') }}">
            ← Back to homepage
        </a>

        <p class="auth-footer">
            SIMPLE TOOLS. BETTER WORKFLOWS.
        </p>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");

        passwordToggle.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            passwordToggle.textContent = isHidden ? "Hide" : "Show";
            passwordToggle.setAttribute("aria-pressed", String(isHidden));
            passwordToggle.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        });
    </script>

</body>
</html>
