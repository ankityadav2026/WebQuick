
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter | QuickWeb</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            color: #f8f7ff;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(ellipse at top left, #301957, transparent 45%),
                linear-gradient(135deg, #170d2b, #100b20);
        }

        a { color: inherit; text-decoration: none; }

        .navbar {
            max-width: 1000px;
            margin: auto;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 18px;
            background: rgba(255,255,255,.045);
        }

        .logo { font-size: 23px; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: #a78bfa; }
        .back { color: #c4b5fd; font-size: 14px; }

        main { max-width: 850px; margin: 65px auto; }
        .eyebrow { color: #b49aff; font-size: 12px; font-weight: bold; letter-spacing: 2px; }
        h1 { margin: 12px 0; font-size: clamp(32px, 5vw, 46px); letter-spacing: -1.5px; }
        .gradient { color: #a78bfa; }
        .subtitle { color: #aaa1bc; line-height: 1.7; }

        .panel {
            margin-top: 30px;
            padding: 24px;
            border: 1px solid rgba(167,139,250,.2);
            border-radius: 20px;
            background: rgba(255,255,255,.045);
        }

        textarea {
            width: 100%;
            min-height: 240px;
            padding: 18px;
            border: 1px solid rgba(167,139,250,.22);
            border-radius: 13px;
            outline: none;
            resize: vertical;
            color: white;
            background: rgba(12,8,25,.65);
            font: inherit;
            line-height: 1.7;
        }

        textarea:focus { border-color: #9b7aff; }
        textarea::placeholder { color: #746b88; }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0;
        }

        button {
            padding: 11px 15px;
            border: 1px solid rgba(167,139,250,.25);
            border-radius: 10px;
            background: rgba(139,92,246,.12);
            color: #eee8ff;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        button:hover { border-color: #a78bfa; transform: translateY(-1px); }
        .primary { background: linear-gradient(135deg, #8b5cf6, #635bdb); border: none; }

        .status { min-height: 20px; color: #c4b5fd; font-size: 13px; }
        footer { margin-top: 50px; text-align: center; color: #776d8b; font-size: 13px; }

        @media (max-width: 550px) {
            body { padding: 14px; }
            .navbar { padding: 16px; }
            main { margin-top: 42px; }
            .panel { padding: 14px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="logo">QUICK<span>WEB</span></a>
        <a href="{{ url_for('tools_dashboard') }}" class="back">← All Tools</a>
    </nav>

    <main>
        <div class="eyebrow">QUICKWEB TOOL #02</div>
        <h1>Case <span class="gradient">Converter.</span></h1>
        <p class="subtitle">Change text formatting instantly. Paste your text and choose a conversion.</p>

        <section class="panel">
            <label for="textInput">YOUR TEXT</label>
            <br><br>
            <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>

            <div class="buttons">
                <button class="primary" data-case="upper">UPPERCASE</button>
                <button data-case="lower">lowercase</button>
                <button data-case="title">Title Case</button>
                <button data-case="sentence">Sentence case</button>
                <button data-case="toggle">tOGGLE cASE</button>
            </div>

            <div class="buttons">
                <button id="copyBtn" class="primary">Copy Text</button>
                <button id="clearBtn">Clear</button>
            </div>

            <div class="status" id="status" role="status" aria-live="polite"></div>
        </section>

        <footer>QuickWeb · Simple tools. Better productivity.</footer>
    </main>

    <script>
        const input = document.getElementById("textInput");
        const status = document.getElementById("status");

        document.querySelectorAll("[data-case]").forEach(button => {
            button.addEventListener("click", () => {
                const value = input.value;
                const mode = button.dataset.case;

                if (mode === "upper") input.value = value.toUpperCase();
                if (mode === "lower") input.value = value.toLowerCase();

                if (mode === "title") {
                    input.value = value.toLowerCase().replace(
                        /(^|[\s([{'"“‘])([a-z])/g,
                        (match, before, letter) => before + letter.toUpperCase()
                    );
                }

                if (mode === "sentence") {
                    input.value = value.toLowerCase().replace(
                        /(^\s*[a-z]|[.!?]\s+[a-z])/g,
                        match => match.toUpperCase()
                    );
                }

                if (mode === "toggle") {
                    input.value = [...value].map(char => {
                        if (char.toLowerCase() === char.toUpperCase()) return char;
                        return char === char.toUpperCase()
                            ? char.toLowerCase()
                            : char.toUpperCase();
                    }).join("");
                }

                status.textContent = "Text converted!";
            });
        });

        document.getElementById("clearBtn").addEventListener("click", () => {
            input.value = "";
            status.textContent = "Text cleared.";
            input.focus();
        });

        document.getElementById("copyBtn").addEventListener("click", async () => {
            if (!input.value) {
                status.textContent = "Enter some text first.";
                return;
            }

            try {
                await navigator.clipboard.writeText(input.value);
                status.textContent = "Text copied!";
            } catch {
                input.select();
                const copied = document.execCommand("copy");
                status.textContent = copied
                    ? "Text copied!"
                    : "Copy failed. Please copy manually.";
            }
        });
    </script>
</body>
</html>
